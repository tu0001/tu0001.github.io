<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>辉夜姬·逃离月球 | 横屏火箭终章</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 强制横屏布局：使用flex旋转或利用宽高比，这里直接用body横向铺满 */
        body {
            background: #05021a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Courier New', monospace;
            /* 横屏锁定提示隐藏，强制宽屏模式 */
            overflow-x: hidden;
        }

        /* 游戏主容器：横屏比例，宽高比接近 16:9 或更大，实际用宽100vh/宽屏适应 */
        .game-wrapper {
            display: flex;
            flex-direction: row;      /* 按钮在右侧，横排布局 */
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 15px 20px;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 20% 30%, #1e173f, #02010a);
            box-sizing: border-box;
        }

        /* canvas 容器：占据主要视野，保持宽高比例 800x450 类似横屏经典比例 */
        .canvas-container {
            position: relative;
            width: min(75vw, 75vh * 1.77);
            height: min(42vw, 42vh);
            max-width: 1200px;
            aspect-ratio: 16 / 9;    /* 横屏黄金比例 16:9 */
            border-radius: 28px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6), 0 0 0 4px #ffddb0, 0 0 0 8px #c97eff;
            background: #1e1a2f;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            cursor: pointer;
        }

        /* 启动界面覆盖层 (横屏适配) */
        .start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(25, 18, 55, 0.96), rgba(12, 8, 28, 0.98));
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(6px);
        }

        .start-title {
            font-size: clamp(28px, 6vw, 52px);
            font-weight: bold;
            color: #FFF2D0;
            text-shadow: 0 0 15px #ff99cc, 0 0 30px #b570ff;
            margin-bottom: 20px;
            letter-spacing: 6px;
        }

        .start-sub {
            font-size: clamp(12px, 3vw, 20px);
            color: #ffdfb3;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
        }

        .start-btn {
            background: radial-gradient(circle at 30% 30%, #ffc0dc, #ff6f9f);
            border: none;
            padding: 12px 42px;
            font-size: clamp(20px, 4vw, 32px);
            font-weight: bold;
            color: #2c1927;
            border-radius: 80px;
            cursor: pointer;
            box-shadow: 0 8px 0 #8b3a5a;
            transition: 0.08s linear;
            font-family: monospace;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #8b3a5a;
        }

        /* 右侧操作面板：竖排按钮，适应横屏手指 */
        .touch-panel {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
            background: rgba(12, 5, 32, 0.7);
            backdrop-filter: blur(18px);
            padding: 20px 18px;
            border-radius: 60px;
            border: 1px solid rgba(255, 210, 160, 0.8);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
        }

        .ctrl-btn {
            width: 80px;
            height: 80px;
            border-radius: 60px;
            background: radial-gradient(circle at 35% 30%, #fff5e6, #ffcc99);
            border: none;
            box-shadow: 0 7px 0 #8b552e;
            font-size: 3rem;
            font-weight: bold;
            color: #3d2a1e;
            cursor: pointer;
            transition: 0.04s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #6a3f1a;
        }

        .jump-btn {
            background: radial-gradient(circle at 35% 30%, #ffe0f0, #ff9bc0);
            box-shadow: 0 7px 0 #b34e6a;
            color: #3c1c2c;
        }

        /* 横屏下适当缩小按钮宽度，在窄屏保持可用 */
        @media (max-width: 800px) and (orientation: landscape) {
            .ctrl-btn { width: 65px; height: 65px; font-size: 2.6rem; }
            .touch-panel { gap: 1rem; padding: 16px 12px; }
            .game-wrapper { gap: 1rem; padding: 10px 16px; }
        }

        @media (max-width: 650px) and (orientation: landscape) {
            .ctrl-btn { width: 58px; height: 58px; font-size: 2.2rem; }
            .touch-panel { gap: 0.9rem; padding: 12px 10px; }
        }

        .info-tip {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #ffefcf;
            background: rgba(0, 0, 0, 0.55);
            padding: 4px 12px;
            border-radius: 40px;
            width: fit-content;
            margin: 0 auto;
            pointer-events: none;
            backdrop-filter: blur(4px);
            font-weight: bold;
        }

        /* 底部提示适配横屏绝对定位不干扰 */
        .canvas-container {
            position: relative;
        }

        /* 锁定屏幕旋转提示可选，但默认无提示，自然横屏 */
        @media (orientation: portrait) {
            body::before {
                content: "↻ 请将设备旋转为横屏模式 ↻";
                position: fixed;
                top: 0; left: 0;
                width: 100%;
                height: 100%;
                background: #000000dd;
                color: #ffdd99;
                font-size: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                backdrop-filter: blur(8px);
                font-weight: bold;
            }
            .game-wrapper { opacity: 0.3; pointer-events: none; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div class="start-overlay" id="startOverlay">
            <div class="start-title">✨ 辉夜姬 ✨</div>
            <div class="start-sub">横屏·逃离荒芜月壤 · 追寻火箭之约</div>
            <button class="start-btn" id="startBtn">逃离月球</button>
        </div>
        <div class="info-tip">⭐ 收集星辉 · 避开尖刺与鬼火 · 登上火箭胜利 ⭐</div>
    </div>
    <div class="touch-panel">
        <button class="ctrl-btn left-btn">←</button>
        <button class="ctrl-btn right-btn">→</button>
        <button class="ctrl-btn jump-btn">↑</button>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');
        // 横屏画布宽高 800x450 (16:9)
        const W = 800, H = 450;
        canvas.width = W;
        canvas.height = H;
        
        let gameRunning = false;
        let gameVictory = false;      
        let gameFailed = false;       
        
        // ========== 音效 ==========
        let audioCtx = null;
        function initAudio() { if(!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
        function playSound(type, vol=0.25) {
            if(!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'jump') { osc.frequency.value=880; gain.gain.setValueAtTime(vol,now); gain.gain.exponentialRampToValueAtTime(0.0001,now+0.25); osc.start(); osc.stop(now+0.22); }
            else if(type === 'collect') { osc.frequency.value=1568; gain.gain.setValueAtTime(vol,now); gain.gain.exponentialRampToValueAtTime(0.0001,now+0.18); osc.start(); osc.stop(now+0.16);
                setTimeout(()=>{ let o2=audioCtx.createOscillator(), g2=audioCtx.createGain(); o2.connect(g2); g2.connect(audioCtx.destination); o2.frequency.value=2093; g2.gain.setValueAtTime(vol*0.6,now+0.1); g2.gain.exponentialRampToValueAtTime(0.0001,now+0.28); o2.start(now+0.1); o2.stop(now+0.26); },10); }
            else if(type === 'victory') { [523,659,784,1046,1318].forEach((f,i)=>{ let o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value=f; g.gain.setValueAtTime(vol*0.5,now+i*0.12); g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.12+0.45); o.start(now+i*0.12); o.stop(now+i*0.12+0.4); }); }
            else if(type === 'spike') { osc.frequency.value=220; gain.gain.setValueAtTime(vol*0.3,now); gain.gain.exponentialRampToValueAtTime(0.0001,now+0.3); osc.start(); osc.stop(now+0.28); }
            else if(type === 'fall') { osc.frequency.value=160; gain.gain.setValueAtTime(vol*0.3,now); gain.gain.exponentialRampToValueAtTime(0.0001,now+0.4); osc.start(); osc.stop(now+0.35); }
        }
        function enableAudio() { if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); else if(!audioCtx) initAudio(); }
        
        // ========== 按键 ==========
        let input = { left: false, right: false, jump: false };
        const leftBtn = document.querySelector('.left-btn'), rightBtn = document.querySelector('.right-btn'), jumpBtn = document.querySelector('.jump-btn');
        function attach(btn, key) {
            btn.addEventListener('touchstart',(e)=>{ e.preventDefault(); input[key]=true; enableAudio(); },{passive:false});
            btn.addEventListener('touchend',(e)=>{ e.preventDefault(); input[key]=false; });
            btn.addEventListener('mousedown',(e)=>{ e.preventDefault(); input[key]=true; enableAudio(); });
            btn.addEventListener('mouseup',()=>{ input[key]=false; });
            btn.addEventListener('mouseleave',()=>{ input[key]=false; });
        }
        attach(leftBtn,'left'); attach(rightBtn,'right'); attach(jumpBtn,'jump');
        window.addEventListener('keydown',(e)=>{ if(e.key==='ArrowLeft'){ input.left=true; e.preventDefault(); enableAudio(); } if(e.key==='ArrowRight'){ input.right=true; e.preventDefault(); } if(e.key==='ArrowUp'||e.key===' '){ input.jump=true; e.preventDefault(); enableAudio(); } });
        window.addEventListener('keyup',(e)=>{ if(e.key==='ArrowLeft') input.left=false; if(e.key==='ArrowRight') input.right=false; if(e.key==='ArrowUp'||e.key===' ') input.jump=false; });
        
        // ========== 玩家属性 (横屏尺寸适配) ==========
        let player = {
            x: 70, y: 370, w: 36, h: 50, vx: 0, vy: 0,
            speed: 5.2, jumpPower: -11.2, gravity: 0.72,
            onGround: false, facingRight: false
        };
        let currentScene = 0;
        let score = 0;
        let message = "";
        let msgTimer = 0;
        let movingHazards = [];   
        let spikes = [];           
        
        // 立绘图片 (保持不变 需提供本地图片或占位 使用内置图形后备，如果图片未加载完成不崩)
        const playerStandImg = new Image();
        const playerMoveImg = new Image();
        playerStandImg.src = "stand.png";  
        playerMoveImg.src = "walk.png";   
        // 优雅降级：如果图片加载失败则用圆形代替，但是不影响整体体验
        let imagesReady = false;
        let imageLoadAttempt = 0;
        function checkImages() {
            if (playerStandImg.complete && playerMoveImg.complete && playerStandImg.naturalWidth > 0) imagesReady = true;
            else setTimeout(checkImages, 200);
        }
        playerStandImg.onload = () => { if(playerMoveImg.complete) imagesReady=true; };
        playerMoveImg.onload = () => { if(playerStandImg.complete) imagesReady=true; };
        setTimeout(checkImages, 300);
        
        // ========== 场景完全重新设计适应横屏 800x450 ==========
        const scenes = [
            { // 场景0: 月之森
                name:"月之森", bgTop:[48,32,88], bgMid:[85,65,130], bgBottom:[135,110,185],
                platforms:[ {x:0,y:430,w:400,h:28,type:"ground"}, {x:450,y:430,w:350,h:28,type:"ground"}, {x:70,y:375,w:70,h:18,type:"questionBlock"}, {x:200,y:325,w:70,h:18,type:"questionBlock"}, {x:340,y:280,w:70,h:18,type:"questionBlock"}, {x:520,y:230,w:70,h:18,type:"questionBlock"}, {x:680,y:190,w:65,h:18,type:"questionBlock"} ],
                stars:[ {x:110,y:340,size:11,col:false,color:[255,210,120]}, {x:240,y:290,size:12,col:false,color:[255,190,255]}, {x:380,y:245,size:10,col:false,color:[200,210,255]}, {x:560,y:195,size:13,col:false,color:[255,230,150]}, {x:710,y:155,size:12,col:false,color:[255,240,180]} ],
                spikes:[], hazards:[]
            },
            { // 场景1: 尖刺回廊
                name:"尖刺回廊", bgTop:[70,45,95], bgMid:[110,80,145], bgBottom:[155,120,180],
                platforms:[ {x:0,y:445,w:130,h:28,type:"ground"}, {x:360,y:445,w:130,h:28,type:"ground"}, {x:670,y:445,w:130,h:28,type:"ground"}, {x:85,y:385,w:70,h:18,type:"questionBlock"}, {x:205,y:330,w:70,h:18,type:"questionBlock"}, {x:320,y:275,w:70,h:18,type:"questionBlock"}, {x:470,y:225,w:70,h:18,type:"questionBlock"}, {x:600,y:180,w:70,h:18,type:"questionBlock"} ],
                stars:[ {x:120,y:350,size:11,col:false,color:[255,200,150]}, {x:240,y:295,size:12,col:false,color:[255,190,210]}, {x:355,y:240,size:10,col:false,color:[180,210,255]}, {x:505,y:190,size:13,col:false,color:[255,220,100]}, {x:635,y:145,size:11,col:false,color:[240,170,255]} ],
                spikes:[ {x:200,y:410,w:45,h:22}, {x:480,y:410,w:45,h:22}, {x:650,y:410,w:45,h:22} ],
                hazards:[]
            },
            { // 场景2: 火焰峡谷
                name:"火焰峡谷", bgTop:[88,45,70], bgMid:[130,70,105], bgBottom:[170,100,130],
                platforms:[ {x:0,y:445,w:150,h:28,type:"ground"}, {x:350,y:445,w:150,h:28,type:"ground"}, {x:650,y:445,w:150,h:28,type:"ground"}, {x:60,y:390,w:70,h:18,type:"questionBlock"}, {x:180,y:340,w:70,h:18,type:"questionBlock"}, {x:300,y:290,w:70,h:18,type:"questionBlock"}, {x:440,y:240,w:70,h:18,type:"questionBlock"}, {x:590,y:200,w:70,h:18,type:"questionBlock"}, {x:720,y:165,w:65,h:18,type:"questionBlock"} ],
                stars:[ {x:95,y:355,size:11,col:false,color:[255,200,130]}, {x:215,y:305,size:12,col:false,color:[255,180,210]}, {x:335,y:255,size:10,col:false,color:[200,200,255]}, {x:475,y:205,size:12,col:false,color:[255,210,100]}, {x:625,y:165,size:11,col:false,color:[230,160,255]}, {x:750,y:130,size:12,col:false,color:[255,190,170]} ],
                spikes:[ {x:540,y:410,w:48,h:22} ],
                hazards:[ {x:150,y:350,dir:1,range:120,radius:9,type:"flame",moveX:true,speed:1.0}, {x:400,y:295,dir:-1,range:110,radius:8,type:"willowisp",moveX:true,speed:0.95}, {x:680,y:250,dir:1,range:90,radius:8,type:"flame",moveX:true,speed:1.2} ]
            },
            { // 场景3: 荆棘月台
                name:"荆棘月台", bgTop:[60,38,85], bgMid:[95,70,125], bgBottom:[140,110,165],
                platforms:[ {x:0,y:445,w:120,h:28,type:"ground"}, {x:300,y:445,w:140,h:28,type:"ground"}, {x:660,y:445,w:140,h:28,type:"ground"}, {x:60,y:395,w:70,h:18,type:"questionBlock"}, {x:170,y:345,w:70,h:18,type:"questionBlock"}, {x:280,y:300,w:70,h:18,type:"questionBlock"}, {x:400,y:255,w:70,h:18,type:"questionBlock"}, {x:520,y:210,w:70,h:18,type:"questionBlock"}, {x:640,y:170,w:70,h:18,type:"questionBlock"} ],
                stars:[ {x:95,y:360,size:11,col:false,color:[255,210,140]}, {x:205,y:310,size:12,col:false,color:[255,200,220]}, {x:315,y:265,size:11,col:false,color:[210,200,255]}, {x:435,y:220,size:12,col:false,color:[255,210,110]}, {x:555,y:175,size:13,col:false,color:[230,180,255]}, {x:675,y:135,size:11,col:false,color:[255,190,180]} ],
                spikes:[ {x:130,y:410,w:48,h:22}, {x:380,y:410,w:55,h:22}, {x:510,y:375,w:40,h:22}, {x:730,y:300,w:45,h:22} ],
                hazards:[]
            },
            { // 场景4: 火箭码头 (火箭在右侧尽头)
                name:"火箭码头", bgTop:[30,25,70], bgMid:[55,48,105], bgBottom:[95,80,130],
                platforms:[ 
                    {x:0,y:455,w:800,h:12,type:"water"},
                    {x:60,y:415,w:100,h:26,type:"ground"},
                    {x:220,y:365,w:80,h:18,type:"questionBlock"},
                    {x:370,y:415,w:110,h:26,type:"ground"},
                    {x:580,y:360,w:90,h:18,type:"ground"},
                    {x:700,y:310,w:70,h:18,type:"rocketPad"}  // 火箭基座
                ],
                stars:[ 
                    {x:100,y:380,size:11,col:false,color:[255,210,170]},
                    {x:260,y:330,size:12,col:false,color:[210,190,255]},
                    {x:415,y:380,size:11,col:false,color:[255,220,150]},
                    {x:620,y:325,size:12,col:false,color:[255,210,180]}
                ],
                spikes:[], 
                hazards:[],
                rocketZone: { x: 710, y: 260, w: 62, h: 58 }  // 火箭碰撞区
            }
        ];
        
        let currentPlat = [], currentStars = [];
        let rocketVictoryFlag = false;
        
        function reloadScene(sceneId){
            const sc = scenes[sceneId];
            currentPlat = sc.platforms.map(p=>({...p}));
            currentStars = sc.stars.map(s=>({...s,col:false}));
            spikes = sc.spikes ? sc.spikes.map(sp=>({...sp})) : [];
            movingHazards = sc.hazards ? sc.hazards.map(h=>({...h, currentX:h.x, angle:Math.random()*Math.PI*2})) : [];
            rocketVictoryFlag = false;
        }
        
        function changeScene(newIdx){
            if(newIdx === currentScene) return;
            currentScene = newIdx;
            reloadScene(currentScene);
            player.x = 70;
            player.y = 370;
            player.vy = 0; player.vx = 0; player.onGround = true;
            player.facingRight = false;
            if(newIdx===4) message="🚀 触碰火箭，逃离月球！🚀";
            else message="⭐ 收集星辰 小心尖刺 ⭐";
            msgTimer=90;
        }
        
        function winGame(finalScore){
            if(gameVictory) return;
            gameRunning = false;
            gameVictory = true;
            gameFailed = false;
            playSound('victory',0.45);
            message = `✨ 胜利！ 辉夜姬乘火箭归乡 ✨  得分: ${Math.floor(finalScore)}`;
            msgTimer = 200;
        }
        
        function failAndReset(){
            if(gameVictory) return;
            playSound('spike',0.3);
            message = "💀 月之试炼失败 · 重新开始 💀";
            msgTimer=70;
            fullReset();
        }
        
        function fullReset(){
            score = 0;
            currentScene = 0;
            reloadScene(0);
            player.x = 70; player.y = 370;
            player.vy = 0; player.vx = 0; player.onGround = true;
            player.facingRight = false;
            gameRunning = true;
            gameVictory = false;
            gameFailed = false;
            message = "逃离月球 · 启程！";
            msgTimer = 80;
        }
        
        function collide(r1,r2){ return !(r2.x>r1.x+r1.w || r2.x+r2.w<r1.x || r2.y>r1.y+r1.h || r2.y+r2.h<r1.y); }
        
        function updateHazards(){
            for(let h of movingHazards){
                if(h.moveX){ h.angle += h.speed*0.05; h.currentX = h.x + Math.sin(h.angle)*h.range; }
                else h.currentX = h.x;
                h.currentY = h.y + Math.sin(Date.now()/400)*5;
            }
        }
        
        function updateGame(){
            if(!gameRunning) return;
            
            let move = (input.left ? -1 : 0) + (input.right ? 1 : 0);
            player.vx = move * player.speed;
            player.x += player.vx;
            if(player.x<3) player.x=3;
            if(player.x+player.w>W-3) player.x=W-player.w-3;
            
            player.vy += player.gravity;
            player.y += player.vy;
            player.onGround = false;
            
            for(let plat of currentPlat){
                const platRect = {x:plat.x,y:plat.y,w:plat.w,h:plat.h};
                const pRect = {x:player.x,y:player.y,w:player.w,h:player.h};
                if(collide(pRect,platRect)){
                    if(player.vy>=0 && (player.y+player.h - plat.y <= plat.h+12)){
                        player.y = plat.y - player.h;
                        player.vy = 0;
                        player.onGround = true;
                    } else if(player.vy<0 && (plat.y+plat.h - player.y <=12)){
                        player.y = plat.y + plat.h;
                        player.vy = 0;
                    } else {
                        if(player.x+player.w/2 < plat.x+plat.w/2) player.x = plat.x - player.w;
                        else player.x = plat.x + plat.w;
                    }
                }
            }
            
            for(let sp of spikes){
                const spikeRect = {x:sp.x, y:sp.y, w:sp.w, h:sp.h};
                const pRect = {x:player.x, y:player.y, w:player.w, h:player.h};
                if(collide(pRect,spikeRect)){
                    failAndReset();
                    return;
                }
            }
            
            for(let h of movingHazards){
                const hazardRect = {x:h.currentX-h.radius, y:h.currentY-h.radius, w:h.radius*2, h:h.radius*2};
                const pRect = {x:player.x,y:player.y,w:player.w,h:player.h};
                if(collide(pRect,hazardRect)){
                    failAndReset();
                    return;
                }
            }
            
            const waterPlat = currentPlat.find(p=>p.type==='water');
            if(waterPlat && player.y+player.h >= waterPlat.y){
                playSound('fall',0.25);
                message = "🌊 坠入月湖 · 重新开始 🌊";
                msgTimer=70;
                fullReset(); 
                return;
            }
            if(player.y+player.h > H){
                playSound('fall',0.2);
                message = "✨ 坠入深渊 ✨";
                msgTimer=70;
                fullReset(); 
                return;
            }
            
            if(input.jump && player.onGround){
                player.vy = player.jumpPower;
                player.onGround = false;
                input.jump = false;
                playSound('jump',0.22);
            }
            
            for(let s of currentStars){
                if(!s.col){
                    const starRect = {x:s.x-s.size/2, y:s.y-s.size/2, w:s.size, h:s.size};
                    const pRect = {x:player.x,y:player.y,w:player.w,h:player.h};
                    if(collide(pRect,starRect)){
                        s.col=true;
                        score+=100;
                        playSound('collect',0.2);
                        message="⭐ +100 星辉 ⭐";
                        msgTimer=25;
                    }
                }
            }
            
            // 场景过渡 (横屏向右)
            if(currentScene===0 && player.x+player.w > W-12) { changeScene(1); player.x=20; playSound('fall',0.08); }
            else if(currentScene===1 && player.x+player.w > W-12) { changeScene(2); player.x=20; }
            else if(currentScene===2 && player.x+player.w > W-12) { changeScene(3); player.x=20; }
            else if(currentScene===3 && player.x+player.w > W-12) { changeScene(4); player.x=40; player.y=380; }
            
            if(currentScene === 4 && !gameVictory){
                const rocketZone = scenes[4].rocketZone;
                const playerRect = {x:player.x, y:player.y, w:player.w, h:player.h};
                const rocketRect = {x:rocketZone.x, y:rocketZone.y, w:rocketZone.w, h:rocketZone.h};
                if(collide(playerRect, rocketRect)){
                    winGame(score);
                    return;
                }
            }
            
            if(player.vx>0) player.facingRight=true;
            if(player.vx<0) player.facingRight=false;
            updateHazards();
            if(msgTimer>0) msgTimer--; else message="";
        }
        
        // 绘图模块 (适配新坐标)
        function drawBackground(){
            const sc = scenes[currentScene];
            const grad = ctx.createLinearGradient(0,0,0,H);
            grad.addColorStop(0,`rgb(${sc.bgTop[0]},${sc.bgTop[1]},${sc.bgTop[2]})`);
            grad.addColorStop(0.6,`rgb(${sc.bgMid[0]},${sc.bgMid[1]},${sc.bgMid[2]})`);
            grad.addColorStop(1,`rgb(${sc.bgBottom[0]},${sc.bgBottom[1]},${sc.bgBottom[2]})`);
            ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
            ctx.fillStyle="rgba(55,40,95,0.3)"; ctx.fillRect(0,H-70,W,70);
            ctx.fillStyle="#FFF5CF"; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(W-90,65,28,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#FFE8AA"; ctx.beginPath(); ctx.arc(W-94,60,7,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
        }
        
        function drawQuestionBlock(x,y,w,h){
            ctx.fillStyle = "#FFD966";
            ctx.shadowBlur = 3;
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = "#C97E2A";
            ctx.strokeRect(x+2, y+2, w-4, h-4);
            ctx.font = `bold ${Math.floor(h*0.6)}px "Segoe UI"`;
            ctx.fillStyle = "#3D2B1A";
            ctx.textAlign = "center";
            ctx.fillText("?", x + w/2, y + h/2);
            ctx.textAlign = "left";
        }
        
        function drawPlatforms(){
            for(let plat of currentPlat){
                if(plat.type === 'questionBlock') drawQuestionBlock(plat.x, plat.y, plat.w, plat.h);
                else if(plat.type === 'rocketPad'){
                    ctx.fillStyle = "#AA8C6F"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                    ctx.fillStyle = "#D9B48B"; ctx.fillRect(plat.x+5, plat.y-6, plat.w-10, 6);
                } else if(plat.type === 'water'){
                    ctx.fillStyle = "rgba(80,150,210,0.7)"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                    for(let i=0;i<20;i++){ ctx.fillStyle=`rgba(255,245,180,${0.4+Math.sin(Date.now()*0.004+i)*0.2})`; ctx.fillRect(plat.x+i*42, plat.y+6, 30, 5); }
                } else {
                    ctx.fillStyle = "#EFC9A0"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                    ctx.fillStyle = "#FFE5C8"; ctx.fillRect(plat.x+5, plat.y-5, plat.w-10, 5);
                }
            }
            ctx.shadowBlur=0;
        }
        
        function drawSpikes(){ for(let sp of spikes){ ctx.fillStyle="#5a4a2e"; ctx.fillRect(sp.x,sp.y,sp.w,sp.h); ctx.fillStyle="#b87c48"; for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(sp.x+i*(sp.w/4), sp.y); ctx.lineTo(sp.x+i*(sp.w/4)+sp.w/8, sp.y-12); ctx.lineTo(sp.x+i*(sp.w/4)+sp.w/4, sp.y); ctx.fill(); } } }
        function drawHazards(){
            for(let h of movingHazards){
                if(h.type==='willowisp'){ ctx.fillStyle=`rgba(255,140,200,0.85)`; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(h.currentX,h.currentY,h.radius,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#FFE68F"; ctx.beginPath(); ctx.arc(h.currentX-2,h.currentY-2,3,0,Math.PI*2); ctx.fill(); }
                else { ctx.fillStyle="#FF6F4A"; ctx.beginPath(); ctx.ellipse(h.currentX,h.currentY,h.radius,h.radius*1.2,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#FFD966"; ctx.beginPath(); ctx.arc(h.currentX-1,h.currentY-1,3,0,Math.PI*2); ctx.fill(); }
            }
            ctx.shadowBlur=0;
        }
        function drawStars(){ for(let s of currentStars){ if(!s.col){ ctx.fillStyle=`rgb(${s.color[0]},${s.color[1]},${s.color[2]})`; ctx.shadowBlur=5; ctx.beginPath(); for(let i=0;i<5;i++){ let ang=(i*72-36)*Math.PI/180, x1=s.x+Math.cos(ang)*s.size/2, y1=s.y+Math.sin(ang)*s.size/2, ang2=(i*72)*Math.PI/180, x2=s.x+Math.cos(ang2)*s.size/3, y2=s.y+Math.sin(ang2)*s.size/3; if(i===0) ctx.moveTo(x1,y1); else ctx.lineTo(x1,y1); ctx.lineTo(x2,y2); } ctx.fill(); } } ctx.shadowBlur=0; }
        
        function drawRocket(){
            if(currentScene !== 4) return;
            const rocket = scenes[4].rocketZone;
            ctx.fillStyle = "#B0B8E0"; ctx.fillRect(rocket.x+10, rocket.y-30, 42, 30);
            ctx.fillStyle = "#FF5F5F"; ctx.beginPath(); ctx.moveTo(rocket.x+rocket.w/2, rocket.y-48); ctx.lineTo(rocket.x+rocket.w/2+15, rocket.y-26); ctx.lineTo(rocket.x+rocket.w/2-15, rocket.y-26); ctx.fill();
            ctx.fillStyle = "#F9C28C"; ctx.fillRect(rocket.x+14, rocket.y-22, 34, 14);
            ctx.fillStyle = "#2B2B3A"; ctx.fillRect(rocket.x+24, rocket.y-12, 14, 22);
            ctx.fillStyle = "#FFF9C4"; ctx.font = "bold 24px monospace"; ctx.fillText("🚀", rocket.x+rocket.w/2-15, rocket.y+6);
            ctx.font = "bold 14px monospace"; ctx.fillStyle = "#FFE8B0"; ctx.fillText("逃逸", rocket.x+20, rocket.y-14);
        }
        
        function drawPlayer(){
            if(imagesReady && playerStandImg.complete && playerMoveImg.naturalWidth>0){
                ctx.save();
                const centerX = player.x + player.w/2, centerY = player.y + player.h/2;
                ctx.translate(centerX, centerY);
                if(player.facingRight) ctx.scale(-1,1);
                let currentImg = (player.vx===0 && player.onGround) ? playerStandImg : playerMoveImg;
                ctx.drawImage(currentImg, -player.w*0.7, -player.h*0.75, player.w*1.4, player.h*1.5);
                ctx.restore();
            } else {
                ctx.fillStyle = "#FFD9A5"; ctx.fillRect(player.x, player.y, player.w, player.h);
                ctx.fillStyle = "#F0A080"; ctx.fillRect(player.x+5, player.y-8, player.w-10, 10);
                ctx.fillStyle = "#332211"; ctx.fillRect(player.x+6, player.y+12, 6, 8); ctx.fillRect(player.x+player.w-12, player.y+12, 6, 8);
            }
        }
        
        function drawUI(){
            ctx.font="bold 24px 'Courier New'"; ctx.fillStyle="#FFF4E0"; ctx.fillRect(W-125,12,115,36); ctx.fillStyle="#482E5A"; ctx.fillText(`${Math.floor(score)}`,W-105,40);
            if(message){ ctx.font="bold 14px 'Segoe UI'"; ctx.fillStyle="#FFFDE7"; ctx.shadowBlur=4; ctx.fillText(message,W/2-ctx.measureText(message).width/2,H-20); ctx.shadowBlur=0; }
            let q = currentScene===0?"🌙 月之森 →":currentScene===1?"⚔️ 尖刺回廊 →":currentScene===2?"🔥 火焰峡谷 →":currentScene===3?"🌵 荆棘月台 →":"🚀 火箭码头 · 触碰火箭胜利";
            ctx.font="12px monospace"; ctx.fillStyle="#FFEFC0"; ctx.fillText(q,12,H-8);
            if(gameVictory){
                ctx.fillStyle="rgba(0,0,0,0.85)"; ctx.fillRect(0,0,W,H);
                ctx.font="bold 34px monospace"; ctx.fillStyle="#FFE68F"; ctx.fillText("✨ 胜利 ✨",W/2-90,180);
                ctx.font="26px monospace"; ctx.fillStyle="#FFD966"; ctx.fillText(`最终星辉 ${Math.floor(score)}`,W/2-100,260);
                ctx.font="18px monospace"; ctx.fillText("点击「逃离月球」再冒险",W/2-140,350);
            }
        }
        
        function gameLoop(){
            updateGame();
            drawBackground();
            drawPlatforms();
            drawSpikes();
            drawStars();
            drawHazards();
            drawRocket();
            drawPlayer();
            drawUI();
            requestAnimationFrame(gameLoop);
        }
        
        startBtn.addEventListener('click',()=>{
            enableAudio();
            fullReset();
            startOverlay.style.display = 'none';
            gameRunning = true;
            gameVictory = false;
        });
        
        function checkRestartOverlay(){
            if((gameVictory || (!gameRunning && startOverlay.style.display !== 'flex')) && startOverlay.style.display !== 'flex' && !gameRunning){
                startOverlay.style.display = 'flex';
            }
        }
        setInterval(checkRestartOverlay,200);
        reloadScene(0);
        gameLoop();
    })();
</script>
</body>
</html>
