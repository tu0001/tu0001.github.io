<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>辉夜姬·逃离月球 | 完整版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #0a0620 0%, #02010f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Courier New', monospace;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            padding: 20px 10px;
        }

        .canvas-container {
            position: relative;
            width: 400px;
            height: 600px;
            border-radius: 32px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), 0 0 0 4px #ffd2a5, 0 0 0 8px #b56eff;
            background: #e0d0ff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 28px;
            cursor: pointer;
        }

        /* 启动界面覆盖层 */
        .start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(30, 20, 60, 0.95), rgba(15, 10, 35, 0.98));
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .start-title {
            font-size: 28px;
            font-weight: bold;
            color: #FFE8C7;
            text-shadow: 0 0 10px #ff88aa, 0 0 20px #b56eff;
            margin-bottom: 30px;
            letter-spacing: 4px;
        }

        .start-sub {
            font-size: 14px;
            color: #ffcfaa;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
        }

        .start-btn {
            background: radial-gradient(circle at 30% 30%, #ffb8d0, #ff6f9f);
            border: none;
            padding: 14px 42px;
            font-size: 24px;
            font-weight: bold;
            color: #2e1a2a;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 0 #8b3a5a;
            transition: 0.08s linear;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #8b3a5a;
        }

        .touch-panel {
            display: flex;
            justify-content: center;
            gap: 2rem;
            background: rgba(20, 12, 45, 0.75);
            backdrop-filter: blur(14px);
            padding: 14px 28px;
            border-radius: 100px;
            border: 1px solid rgba(255, 200, 170, 0.7);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .ctrl-btn {
            width: 80px;
            height: 80px;
            border-radius: 60px;
            background: radial-gradient(circle at 30% 25%, #fff2e0, #ffc895);
            border: none;
            box-shadow: 0 7px 0 #8b4e2a;
            font-size: 2.8rem;
            font-weight: bold;
            color: #3a2420;
            cursor: pointer;
            transition: 0.04s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #6b3a1a;
        }

        .jump-btn {
            background: radial-gradient(circle at 30% 25%, #ffdcec, #ff9bc0);
            box-shadow: 0 7px 0 #b54a6a;
            color: #3c1c2c;
        }

        @media (max-width: 500px) {
            .canvas-container { width: 360px; height: 540px; }
            .ctrl-btn { width: 70px; height: 70px; font-size: 2.4rem; }
        }
        @media (max-width: 420px) {
            .canvas-container { width: 320px; height: 480px; }
            .ctrl-btn { width: 65px; height: 65px; font-size: 2rem; }
        }
        .info-tip {
            text-align: center;
            font-size: 12px;
            color: #ffecce;
            background: rgba(0,0,0,0.5);
            padding: 5px 16px;
            border-radius: 40px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="start-overlay" id="startOverlay">
            <div class="start-title">✨ 辉夜姬 ✨</div>
            <div class="start-sub">逃离荒芜月壤 · 追寻星之彼方</div>
            <button class="start-btn" id="startBtn">逃离月球</button>
        </div>
    </div>
    <div class="touch-panel">
        <button class="ctrl-btn left-btn">←</button>
        <button class="ctrl-btn right-btn">→</button>
        <button class="ctrl-btn jump-btn">↑</button>
    </div>
    <div class="info-tip">⭐ 收集星辉 · 避开尖刺 · 乘船终局 ⭐</div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');
        const W = 400, H = 600;
        
        let gameRunning = false;
        let gameEnded = false;      // 游戏结束显示分数
        
        // ========== 音效 ==========
        let audioCtx = null;
        function initAudio() { if(!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
        function playSound(type, vol=0.25) {
            if(!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'jump') { osc.frequency.value=880; gain.gain.setValueAtTime(vol,now); gain.gain.exponentialRampToValueAtTime(0.0001,now+0.25); osc.start(); osc.stop(now+0.22); }
            else if(type === 'collect') { osc.frequency.value=1568; gain.gain.setValueAtTime(vol,now); gain.gain.exponentialRampToValueAtTime(0.0001,now+0.18); osc.start(); osc.stop(now+0.16);
                setTimeout(()=>{ let o2=audioCtx.createOscillator(), g2=audioCtx.createGain(); o2.connect(g2); g2.connect(audioCtx.destination); o2.frequency.value=2093; g2.gain.setValueAtTime(vol*0.6,now+0.1); g2.gain.exponentialRampToValueAtTime(0.0001,now+0.28); o2.start(now+0.1); o2.stop(now+0.26); },10); }
            else if(type === 'escape') { [523,659,784,1046].forEach((f,i)=>{ let o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value=f; g.gain.setValueAtTime(vol*0.5,now+i*0.12); g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.12+0.35); o.start(now+i*0.12); o.stop(now+i*0.12+0.32); }); }
            else if(type === 'spike') { osc.frequency.value=220; gain.gain.setValueAtTime(vol*0.3,now); gain.gain.exponentialRampToValueAtTime(0.0001,now+0.3); osc.start(); osc.stop(now+0.28); }
            else if(type === 'fall') { osc.frequency.value=160; gain.gain.setValueAtTime(vol*0.3,now); gain.gain.exponentialRampToValueAtTime(0.0001,now+0.4); osc.start(); osc.stop(now+0.35); }
        }
        function enableAudio() { if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); else if(!audioCtx) initAudio(); }
        
        // ========== 按键 ==========
        let input = { left: false, right: false, jump: false };
        const leftBtn = document.querySelector('.left-btn'), rightBtn = document.querySelector('.right-btn'), jumpBtn = document.querySelector('.jump-btn');
        function attach(btn, key) {
            btn.addEventListener('touchstart',(e)=>{ e.preventDefault(); input[key]=true; enableAudio(); },{passive:false});
            btn.addEventListener('touchend',(e)=>{ e.preventDefault(); input[key]=false; });
            btn.addEventListener('mousedown',(e)=>{ e.preventDefault(); input[key]=true; enableAudio(); });
            btn.addEventListener('mouseup',()=>{ input[key]=false; });
            btn.addEventListener('mouseleave',()=>{ input[key]=false; });
        }
        attach(leftBtn,'left'); attach(rightBtn,'right'); attach(jumpBtn,'jump');
        window.addEventListener('keydown',(e)=>{ if(e.key==='ArrowLeft'){ input.left=true; e.preventDefault(); enableAudio(); } if(e.key==='ArrowRight'){ input.right=true; e.preventDefault(); } if(e.key==='ArrowUp'||e.key===' '){ input.jump=true; e.preventDefault(); enableAudio(); } });
        window.addEventListener('keyup',(e)=>{ if(e.key==='ArrowLeft') input.left=false; if(e.key==='ArrowRight') input.right=false; if(e.key==='ArrowUp'||e.key===' ') input.jump=false; });
        
        // ========== 玩家 ==========
        let player = {
            x: 60, y: 520, w: 28, h: 42, vx: 0, vy: 0,
            speed: 4.3, jumpPower: -10.8, gravity: 0.68,
            onGround: false, facingRight: true
        };
        let currentScene = 0;
        let score = 0;
        let message = "";
        let msgTimer = 0;
        let movingHazards = [];   // 移动火焰/鬼火
        let spikes = [];           // 地刺 (静态)
        
        // ========== 5个完整场景 (平台,星星,地刺,移动陷阱) ==========
        const scenes = [
            { // 场景0: 月之森
                name:"月之森", bgTop:[48,32,88], bgMid:[85,65,130], bgBottom:[135,110,185],
                platforms:[ {x:0,y:560,w:400,h:40,type:"ground"}, {x:45,y:500,w:70,h:18,type:"pinkMoon"}, {x:155,y:440,w:70,h:18,type:"pinkMoon"}, {x:265,y:380,w:70,h:18,type:"pinkMoon"}, {x:340,y:310,w:55,h:18,type:"pinkMoon"} ],
                stars:[ {x:80,y:470,size:11,col:false,color:[255,210,120]}, {x:190,y:405,size:12,col:false,color:[255,190,255]}, {x:300,y:345,size:10,col:false,color:[200,210,255]}, {x:370,y:275,size:13,col:false,color:[255,230,150]} ],
                spikes:[], hazards:[]
            },
            { // 场景1: 尖刺回廊 (加入地刺)
                name:"尖刺回廊", bgTop:[70,45,95], bgMid:[110,80,145], bgBottom:[155,120,180],
                platforms:[ {x:0,y:570,w:90,h:28,type:"ground"}, {x:310,y:570,w:90,h:28,type:"ground"}, {x:60,y:495,w:70,h:18,type:"pinkMoon"}, {x:165,y:430,w:70,h:18,type:"pinkMoon"}, {x:270,y:365,w:65,h:18,type:"pinkMoon"}, {x:85,y:310,w:70,h:18,type:"pinkMoon"}, {x:315,y:255,w:60,h:18,type:"pinkMoon"} ],
                stars:[ {x:95,y:460,size:11,col:false,color:[255,200,150]}, {x:200,y:395,size:12,col:false,color:[255,190,210]}, {x:305,y:330,size:10,col:false,color:[180,210,255]}, {x:120,y:275,size:13,col:false,color:[255,220,100]}, {x:345,y:220,size:11,col:false,color:[240,170,255]} ],
                spikes:[ {x:180,y:540,w:35,h:20}, {x:260,y:480,w:35,h:20}, {x:340,y:410,w:35,h:20} ],
                hazards:[]
            },
            { // 场景2: 火焰峡谷 (移动鬼火)
                name:"火焰峡谷", bgTop:[88,45,70], bgMid:[130,70,105], bgBottom:[170,100,130],
                platforms:[ {x:0,y:570,w:100,h:28,type:"ground"}, {x:300,y:570,w:100,h:28,type:"ground"}, {x:45,y:500,w:70,h:18,type:"pinkMoon"}, {x:150,y:440,w:70,h:18,type:"pinkMoon"}, {x:250,y:380,w:70,h:18,type:"pinkMoon"}, {x:60,y:320,w:70,h:18,type:"pinkMoon"}, {x:330,y:270,w:55,h:18,type:"pinkMoon"} ],
                stars:[ {x:80,y:465,size:11,col:false,color:[255,200,130]}, {x:185,y:405,size:12,col:false,color:[255,180,210]}, {x:285,y:345,size:10,col:false,color:[200,200,255]}, {x:95,y:285,size:12,col:false,color:[255,210,100]}, {x:360,y:235,size:11,col:false,color:[230,160,255]} ],
                spikes:[ {x:210,y:530,w:40,h:20} ],
                hazards:[ {x:120,y:460,dir:1,range:100,radius:8,type:"flame",moveX:true,speed:1.1}, {x:280,y:400,dir:-1,range:90,radius:7,type:"willowisp",moveX:true,speed:0.9} ]
            },
            { // 场景3: 荆棘月台 (大量地刺)
                name:"荆棘月台", bgTop:[60,38,85], bgMid:[95,70,125], bgBottom:[140,110,165],
                platforms:[ {x:0,y:570,w:80,h:28,type:"ground"}, {x:320,y:570,w:80,h:28,type:"ground"}, {x:50,y:505,w:65,h:18,type:"pinkMoon"}, {x:145,y:455,w:70,h:18,type:"pinkMoon"}, {x:250,y:395,w:70,h:18,type:"pinkMoon"}, {x:70,y:340,w:70,h:18,type:"pinkMoon"}, {x:185,y:285,w:70,h:18,type:"pinkMoon"}, {x:300,y:235,w:55,h:18,type:"pinkMoon"} ],
                stars:[ {x:85,y:470,size:11,col:false,color:[255,210,140]}, {x:180,y:420,size:12,col:false,color:[255,200,220]}, {x:285,y:360,size:11,col:false,color:[210,200,255]}, {x:105,y:305,size:12,col:false,color:[255,210,110]}, {x:220,y:250,size:13,col:false,color:[230,180,255]}, {x:330,y:200,size:11,col:false,color:[255,190,180]} ],
                spikes:[ {x:110,y:535,w:40,h:20}, {x:270,y:490,w:45,h:20}, {x:30,y:400,w:35,h:20}, {x:370,y:315,w:35,h:20} ],
                hazards:[]
            },
            { // 场景4: 离别月舟 (大船结局)
                name:"离别月舟", bgTop:[30,25,70], bgMid:[55,48,105], bgBottom:[95,80,130],
                platforms:[ {x:0,y:590,w:400,h:12,type:"water"}, {x:70,y:510,w:260,h:38,type:"boat"} ],
                stars:[ {x:150,y:475,size:12,col:false,color:[255,210,170]}, {x:250,y:475,size:12,col:false,color:[210,190,255]} ],
                spikes:[], hazards:[]
            }
        ];
        
        let currentPlat = [], currentStars = [];
        
        function reloadScene(sceneId){
            const sc = scenes[sceneId];
            currentPlat = sc.platforms.map(p=>({...p}));
            currentStars = sc.stars.map(s=>({...s,col:false}));
            spikes = sc.spikes ? sc.spikes.map(sp=>({...sp})) : [];
            movingHazards = sc.hazards ? sc.hazards.map(h=>({...h, currentX:h.x, angle:Math.random()*Math.PI*2})) : [];
        }
        
        function changeScene(newIdx){
            if(newIdx===currentScene) return;
            currentScene = newIdx;
            reloadScene(currentScene);
            player.x = 50;
            player.y = 500;
            player.vy = 0; player.vx = 0; player.onGround = true;
            if(newIdx===4) message="✨ 踏上月舟 · 按跳跃逃离 ✨";
            else message="⭐ 收集星辰 小心尖刺 ⭐";
            msgTimer=90;
        }
        
        function gameOver(finalScore){
            gameRunning = false;
            gameEnded = true;
            message = `⭐ 得分: ${finalScore} ⭐`;
            playSound('escape',0.3);
        }
        
        function fullReset(){
            score = 0;
            currentScene = 0;
            reloadScene(0);
            player.x = 60; player.y = 520;
            player.vy = 0; player.vx = 0; player.onGround = true;
            gameEnded = false;
            gameRunning = true;
            message = "逃离月球 · 启程！";
            msgTimer = 80;
        }
        
        function collide(r1,r2){ return !(r2.x>r1.x+r1.w || r2.x+r2.w<r1.x || r2.y>r1.y+r1.h || r2.y+r2.h<r1.y); }
        
        function updateHazards(){
            for(let h of movingHazards){
                if(h.moveX){ h.angle += h.speed*0.05; h.currentX = h.x + Math.sin(h.angle)*h.range; }
                else h.currentX = h.x;
                h.currentY = h.y + Math.sin(Date.now()/400)*5;
            }
        }
        
        function updateGame(){
            if(!gameRunning) return;
            // 移动
            let move = (input.left ? -1 : 0) + (input.right ? 1 : 0);
            player.vx = move * player.speed;
            player.x += player.vx;
            if(player.x<2) player.x=2;
            if(player.x+player.w>W-2) player.x=W-player.w-2;
            // 重力
            player.vy += player.gravity;
            player.y += player.vy;
            player.onGround = false;
            let onBoat = false;
            // 平台碰撞
            for(let plat of currentPlat){
                const platRect = {x:plat.x,y:plat.y,w:plat.w,h:plat.h};
                const pRect = {x:player.x,y:player.y,w:player.w,h:player.h};
                if(collide(pRect,platRect)){
                    if(player.vy>=0 && (player.y+player.h - plat.y <= plat.h+12)){
                        player.y = plat.y - player.h;
                        player.vy = 0;
                        player.onGround = true;
                        if(plat.type==='boat') onBoat=true;
                    } else if(player.vy<0 && (plat.y+plat.h - player.y <=12)){
                        player.y = plat.y + plat.h;
                        player.vy = 0;
                    } else {
                        if(player.x+player.w/2 < plat.x+plat.w/2) player.x = plat.x - player.w;
                        else player.x = plat.x + plat.w;
                    }
                }
            }
            // 地刺伤害
            for(let sp of spikes){
                const spikeRect = {x:sp.x, y:sp.y, w:sp.w, h:sp.h};
                const pRect = {x:player.x, y:player.y, w:player.w, h:player.h};
                if(collide(pRect,spikeRect)){
                    playSound('spike',0.3);
                    message = "💀 尖刺之痛 · 重归起点 💀";
                    msgTimer=70;
                    fullReset();
                    return;
                }
            }
            // 移动危险物
            for(let h of movingHazards){
                const hazardRect = {x:h.currentX-h.radius, y:h.currentY-h.radius, w:h.radius*2, h:h.radius*2};
                const pRect = {x:player.x,y:player.y,w:player.w,h:player.h};
                if(collide(pRect,hazardRect)){
                    playSound('spike',0.28);
                    message = "🔥 邪火焚身 · 重归起点 🔥";
                    msgTimer=70;
                    fullReset();
                    return;
                }
            }
            // 水/掉落死亡
            const waterPlat = currentPlat.find(p=>p.type==='water');
            if(waterPlat && player.y+player.h >= waterPlat.y){
                playSound('fall',0.25);
                message = "🌊 坠入月湖 · 重新开始 🌊";
                msgTimer=70;
                fullReset(); return;
            }
            if(player.y+player.h > H){
                playSound('fall',0.2);
                message = "✨ 坠入深渊 ✨";
                msgTimer=70;
                fullReset(); return;
            }
            // 跳跃
            if(input.jump && player.onGround){
                player.vy = player.jumpPower;
                player.onGround = false;
                input.jump = false;
                playSound('jump',0.22);
            }
            // 收集星星
            for(let s of currentStars){
                if(!s.col){
                    const starRect = {x:s.x-s.size/2, y:s.y-s.size/2, w:s.size, h:s.size};
                    const pRect = {x:player.x,y:player.y,w:player.w,h:player.h};
                    if(collide(pRect,starRect)){
                        s.col=true;
                        score+=100;
                        playSound('collect',0.2);
                        message="⭐ +100 星辉 ⭐";
                        msgTimer=25;
                    }
                }
            }
            // 场景切换 (向右)
            if(currentScene===0 && player.x+player.w > W-15) { changeScene(1); player.x=20; playSound('fall',0.08); }
            else if(currentScene===1 && player.x+player.w > W-15) { changeScene(2); player.x=20; }
            else if(currentScene===2 && player.x+player.w > W-15) { changeScene(3); player.x=20; }
            else if(currentScene===3 && player.x+player.w > W-15) { changeScene(4); player.x=70; player.y=470; }
            // 大船结局: 最后场景 按跳跃结束游戏显示分数
            const boat = currentPlat.find(p=>p.type==='boat');
            if(currentScene===4 && boat && player.onGround && player.x+player.w>boat.x && player.x<boat.x+boat.w){
                if(input.jump){
                    gameOver(score);
                    input.jump=false;
                    return;
                }
            }
            if(player.vx>0) player.facingRight=true;
            if(player.vx<0) player.facingRight=false;
            updateHazards();
            if(msgTimer>0) msgTimer--; else message="";
        }
        
        // ========== 绘图 ==========
        function drawBackground(){
            const sc = scenes[currentScene];
            const grad = ctx.createLinearGradient(0,0,0,H);
            grad.addColorStop(0,`rgb(${sc.bgTop[0]},${sc.bgTop[1]},${sc.bgTop[2]})`);
            grad.addColorStop(0.5,`rgb(${sc.bgMid[0]},${sc.bgMid[1]},${sc.bgMid[2]})`);
            grad.addColorStop(1,`rgb(${sc.bgBottom[0]},${sc.bgBottom[1]},${sc.bgBottom[2]})`);
            ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
            ctx.fillStyle="rgba(45,30,75,0.4)";
            ctx.beginPath(); ctx.moveTo(0,540); ctx.lineTo(70,490); ctx.lineTo(150,530); ctx.lineTo(230,470); ctx.lineTo(310,510); ctx.lineTo(400,460); ctx.lineTo(400,600); ctx.lineTo(0,600); ctx.fill();
            ctx.fillStyle="#FFF5CF"; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(330,60,25,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#EEDDAA"; ctx.beginPath(); ctx.arc(326,56,6,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
            for(let i=0;i<6;i++){ ctx.fillStyle=`rgba(255,245,220,${0.1+Math.sin(Date.now()*0.0006+i)*0.06})`; ctx.beginPath(); ctx.ellipse(30+i*70+Math.sin(Date.now()*0.0005)*6,90+i*18,28,16,0,0,Math.PI*2); ctx.fill(); }
        }
        function drawPlatforms(){
            for(let plat of currentPlat){
                if(plat.type==='pinkMoon'){
                    ctx.fillStyle="#FFB0C4"; ctx.shadowBlur=5; ctx.fillRect(plat.x,plat.y,plat.w,plat.h);
                    ctx.fillStyle="#FFE4F0"; ctx.beginPath(); ctx.arc(plat.x+plat.w/2,plat.y-5,11,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle="#FF7F9F"; ctx.beginPath(); ctx.arc(plat.x+plat.w/2+2,plat.y-7,3,0,Math.PI*2); ctx.fill();
                } else if(plat.type==='boat'){
                    ctx.fillStyle="#B87C4F"; ctx.fillRect(plat.x,plat.y,plat.w,plat.h);
                    ctx.fillStyle="#DEB887"; ctx.fillRect(plat.x+15,plat.y-14,plat.w-30,14);
                    ctx.fillStyle="#FFF0C0"; ctx.beginPath(); ctx.moveTo(plat.x+plat.w/2-28,plat.y-26); ctx.lineTo(plat.x+plat.w/2,plat.y-52); ctx.lineTo(plat.x+plat.w/2+28,plat.y-26); ctx.fill();
                    ctx.fillStyle="#FFCF8A"; ctx.font="28px monospace"; ctx.fillText("⛵",plat.x+plat.w/2-15,plat.y-24);
                    ctx.fillStyle="#FFF6E0"; ctx.fillRect(plat.x+plat.w/2-6,plat.y-40,12,32);
                } else if(plat.type==='water'){
                    ctx.fillStyle="rgba(100,160,210,0.65)"; ctx.fillRect(plat.x,plat.y,plat.w,plat.h);
                    for(let i=0;i<15;i++){ ctx.fillStyle=`rgba(255,255,210,${0.3+Math.sin(Date.now()*0.004+i)*0.2})`; ctx.fillRect(plat.x+i*27,plat.y+5,20,3); }
                } else {
                    ctx.fillStyle="#EFC9A0"; ctx.fillRect(plat.x,plat.y,plat.w,plat.h);
                    ctx.fillStyle="#FFE5C8"; ctx.fillRect(plat.x+4,plat.y-5,plat.w-8,5);
                }
            }
            ctx.shadowBlur=0;
        }
        function drawSpikes(){
            for(let sp of spikes){
                ctx.fillStyle="#5a4a2e"; ctx.fillRect(sp.x,sp.y,sp.w,sp.h);
                ctx.fillStyle="#8b6b42"; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(sp.x+ i*(sp.w/5), sp.y); ctx.lineTo(sp.x+ i*(sp.w/5)+sp.w/10, sp.y-12); ctx.lineTo(sp.x+ i*(sp.w/5)+sp.w/5, sp.y); ctx.fill(); }
                ctx.fillStyle="#c99e5f"; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(sp.x+ i*(sp.w/5)+2, sp.y+2); ctx.lineTo(sp.x+ i*(sp.w/5)+sp.w/10, sp.y-8); ctx.lineTo(sp.x+ i*(sp.w/5)+sp.w/5-2, sp.y+2); ctx.fill(); }
            }
        }
        function drawHazards(){
            for(let h of movingHazards){
                if(h.type==='willowisp'){
                    ctx.fillStyle=`rgba(255,120,180,0.85)`; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(h.currentX,h.currentY,h.radius,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle="#FFEEAA"; ctx.beginPath(); ctx.arc(h.currentX-2,h.currentY-2,3,0,Math.PI*2); ctx.fill();
                } else {
                    ctx.fillStyle="#FF6F4A"; ctx.beginPath(); ctx.ellipse(h.currentX,h.currentY,h.radius,h.radius*1.2,0,0,Math.PI*2); ctx.fill();
                    ctx.fillStyle="#FFD966"; ctx.beginPath(); ctx.ellipse(h.currentX-1,h.currentY-1,3,3,0,0,Math.PI*2); ctx.fill();
                }
                ctx.shadowBlur=0;
            }
        }
        function drawStars(){
            for(let s of currentStars){
                if(!s.col){
                    ctx.fillStyle=`rgb(${s.color[0]},${s.color[1]},${s.color[2]})`; ctx.shadowBlur=5;
                    ctx.beginPath();
                    for(let i=0;i<5;i++){ let ang=(i*72-36)*Math.PI/180, x1=s.x+Math.cos(ang)*s.size/2, y1=s.y+Math.sin(ang)*s.size/2, ang2=(i*72)*Math.PI/180, x2=s.x+Math.cos(ang2)*s.size/3, y2=s.y+Math.sin(ang2)*s.size/3; if(i===0) ctx.moveTo(x1,y1); else ctx.lineTo(x1,y1); ctx.lineTo(x2,y2); }
                    ctx.fill();
                }
            }
            ctx.shadowBlur=0;
        }
        function drawPlayer(){
            ctx.save();
            if(!player.facingRight){ ctx.translate(player.x+player.w/2,player.y+player.h/2); ctx.scale(-1,1); ctx.translate(-(player.x+player.w/2),-(player.y+player.h/2)); }
            let x=player.x,y=player.y;
            ctx.fillStyle="#FADB67"; ctx.fillRect(x+6,y+2,16,12);
            ctx.fillStyle="#FCE8A8"; ctx.fillRect(x+2,y+12,24,8);
            ctx.fillStyle="#FFDABC"; ctx.fillRect(x+8,y+14,12,18);
            ctx.fillStyle="#D94F6A"; ctx.fillRect(x+12,y+20,3,4); ctx.fillRect(x+20,y+20,3,4);
            ctx.fillStyle="#2C2340"; ctx.fillRect(x+6,y+30,20,16);
            ctx.fillStyle="#F3B0C2"; ctx.fillRect(x+12,y+32,4,6); ctx.fillRect(x+18,y+32,4,6);
            ctx.fillStyle="#FFDABC"; ctx.fillRect(x+8,y+44,5,8); ctx.fillRect(x+19,y+44,5,8);
            if(Math.floor(Date.now()/150)%2===0){ ctx.fillStyle="#FFB8D9"; ctx.fillRect(x+24,y+22,5,10); }
            ctx.restore();
        }
        function drawUI(){
            ctx.font="bold 22px 'Courier New'"; ctx.fillStyle="#FFF4E0"; ctx.fillRect(W-100,12,92,32); ctx.fillStyle="#482E5A"; ctx.fillText(`${Math.floor(score).toString().padStart(6,'0')}`,W-95,38);
            if(message){ ctx.font="bold 12px 'Segoe UI'"; ctx.fillStyle="#FFFDE7"; ctx.shadowBlur=4; ctx.fillText(message,W/2-ctx.measureText(message).width/2,H-22); ctx.shadowBlur=0; }
            let q = currentScene===0?"🌙 月之森 →":currentScene===1?"⚔️ 尖刺回廊 →":currentScene===2?"🔥 火焰峡谷 →":currentScene===3?"🌵 荆棘月台 →":"🚢 月舟 · 跳跃逃离";
            ctx.font="10px monospace"; ctx.fillStyle="#FFEFC0"; ctx.fillText(q,12,H-8);
            if(gameEnded){
                ctx.fillStyle="rgba(0,0,0,0.75)"; ctx.fillRect(0,0,W,H);
                ctx.font="bold 28px monospace"; ctx.fillStyle="#FFE6B0"; ctx.fillText("GAME OVER",W/2-100,240);
                ctx.font="20px monospace"; ctx.fillStyle="#FFC9A0"; ctx.fillText(`得分 ${Math.floor(score)}`,W/2-55,300);
                ctx.font="14px monospace"; ctx.fillStyle="#FFAA88"; ctx.fillText("点击「逃离月球」重新开始",W/2-110,380);
            }
        }
        
        function gameLoop(){
            updateGame();
            drawBackground();
            drawPlatforms();
            drawSpikes();
            drawStars();
            drawHazards();
            drawPlayer();
            drawUI();
            requestAnimationFrame(gameLoop);
        }
        
        // 启动界面逻辑
        startBtn.addEventListener('click',()=>{
            enableAudio();
            fullReset();
            startOverlay.style.display = 'none';
            gameRunning = true;
            gameEnded = false;
        });
        // 如果游戏结束且覆盖层隐藏，但需要重启（通过覆盖层重启）
        function checkRestart(){
            if(gameEnded && startOverlay.style.display === 'none'){
                startOverlay.style.display = 'flex';
            }
        }
        setInterval(checkRestart,100);
        reloadScene(0);
        gameLoop();
    })();
</script>
</body>
</html>
