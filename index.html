<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>辉夜姬·五境传说 | 月华归乡·火箭终章</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: #0a0620;
        }

        body {
            font-family: 'Segoe UI', 'Noto Sans CJK SC', 'Courier New', monospace;
        }

        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .canvas-area {
            flex: 1;
            position: relative;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0620;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0b0822;
        }

        .start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1338 0%, #0c0820 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        .start-title {
            font-size: clamp(36px, 10vw, 80px);
            font-weight: bold;
            color: #FFF5E0;
            text-shadow: 0 0 30px #ff88aa, 0 0 50px #b56eff, 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            letter-spacing: 12px;
            font-family: 'Noto Sans CJK SC', monospace;
        }

        .start-sub {
            font-size: clamp(16px, 5vw, 24px);
            color: #ffefc0;
            margin-bottom: 50px;
            text-align: center;
            padding: 0 24px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .start-btn {
            background: linear-gradient(135deg, #ffb7c5, #ff6f9f);
            border: none;
            padding: 14px 56px;
            font-size: clamp(26px, 6vw, 44px);
            font-weight: bold;
            color: #2a1422;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 12px 0 #8b3a5a;
            transition: 0.08s linear;
            font-family: monospace;
            letter-spacing: 4px;
        }

        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 0 5px 0 #8b3a5a;
        }

        .bottom-controls {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 28px calc(12px + env(safe-area-inset-bottom, 0));
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            z-index: 20;
            pointer-events: auto;
            min-height: 95px;
            border-top: 1px solid rgba(255, 220, 160, 0.3);
        }

        .left-buttons { display: flex; gap: 1.5rem; }
        .right-button { display: flex; }

        .ctrl-btn {
            width: 80px;
            height: 80px;
            border-radius: 60px;
            background: rgba(255, 245, 225, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 210, 140, 0.8);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
            font-size: 3.2rem;
            font-weight: bold;
            color: #3a2a2a;
            cursor: pointer;
            transition: 0.05s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .ctrl-btn:active { transform: scale(0.93); background: rgba(255, 210, 160, 0.96); }
        .jump-btn { background: rgba(255, 200, 220, 0.9); border-color: rgba(255, 150, 190, 0.8); }

        @media (max-width: 850px) and (orientation: landscape) {
            .ctrl-btn { width: 70px; height: 70px; font-size: 2.8rem; }
            .bottom-controls { padding: 8px 20px calc(8px + env(safe-area-inset-bottom,0)); min-height: 85px; }
            .left-buttons { gap: 1.2rem; }
        }
        @media (max-width: 650px) and (orientation: landscape) {
            .ctrl-btn { width: 62px; height: 62px; font-size: 2.4rem; }
            .bottom-controls { padding: 6px 16px calc(6px + env(safe-area-inset-bottom,0)); min-height: 78px; }
        }

        .fullscreen-tip {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 18px;
            border-radius: 40px;
            color: #ffddbb;
            font-size: 12px;
            z-index: 25;
            pointer-events: none;
            white-space: nowrap;
            transition: opacity 0.5s;
        }
        .fullscreen-tip.fade-out { opacity: 0; }

        .rotate-tip {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000ee;
            backdrop-filter: blur(14px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffecb3;
            font-size: 26px;
            text-align: center;
            font-family: monospace;
            pointer-events: none;
        }
        .rotate-tip.hidden { display: none; }
        .rotate-icon { font-size: 90px; margin-bottom: 20px; animation: rotateHint 1.4s infinite ease; }
        .rotate-text { background: rgba(0,0,0,0.7); padding: 12px 32px; border-radius: 60px; font-size: 20px; border: 1px solid #ffcc88; }
        @keyframes rotateHint { 0%,100%{ transform: rotate(0deg); } 40%{ transform: rotate(90deg); } 80%{ transform: rotate(90deg); } }
        @media (orientation: landscape) { .rotate-tip { display: none; } }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="canvas-area">
        <canvas id="gameCanvas"></canvas>
        <div class="start-overlay" id="startOverlay">
            <div class="start-title">✨ 輝夜姬 ✨</div>
            <div class="start-sub">五境传说 · 乘火箭归乡</div>
            <button class="start-btn" id="startBtn">月 华 启 程</button>
        </div>
    </div>
    <div class="bottom-controls">
        <div class="left-buttons"><button class="ctrl-btn left-btn">←</button><button class="ctrl-btn right-btn">→</button></div>
        <div class="right-button"><button class="ctrl-btn jump-btn">↑</button></div>
    </div>
    <div class="fullscreen-tip" id="fullscreenTip">✨ 点击画面全屏 · 横屏沉浸体验 ✨</div>
</div>
<div class="rotate-tip" id="rotateTip"><div class="rotate-icon">📱🔄</div><div class="rotate-text">请打开「自动旋转」<br>横屏获得最佳体验</div></div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');
        const rotateTip = document.getElementById('rotateTip');
        const gameContainer = document.getElementById('gameContainer');
        const fullscreenTip = document.getElementById('fullscreenTip');
        
        const LOGIC_W = 1440;
        const LOGIC_H = 810;
        
        let gameRunning = false;
        let gameVictory = false;
        
        // 加载启动背景图
        const startBgTest = new Image();
        startBgTest.onload = () => {
            startOverlay.style.backgroundImage = `url('bg_start.png')`;
            startOverlay.style.backgroundSize = 'cover';
            startOverlay.style.backgroundPosition = 'center';
        };
        startBgTest.src = 'bg_start.png';
        
        // ========== 角色动画资源 ==========
        let playerStandImg = null;
        let playerWalkImg = null;
        let playerImgReady = false;
        let walkFrames = 4;      // walk.png 横向4帧
        let currentFrame = 0;
        let frameCounter = 0;
        let frameDelay = 6;       // 每6帧切换一次动画帧（约10fps动画）
        
        // 加载站立图片
        playerStandImg = new Image();
        playerStandImg.onload = () => { checkAllImagesLoaded(); };
        playerStandImg.onerror = () => { console.log("stand.png 未找到，使用Canvas绘制"); playerStandImg = null; checkAllImagesLoaded(); };
        playerStandImg.src = "stand.png";
        
        // 加载行走精灵表
        playerWalkImg = new Image();
        playerWalkImg.onload = () => { checkAllImagesLoaded(); };
        playerWalkImg.onerror = () => { console.log("walk.png 未找到，使用站立图替代"); playerWalkImg = null; checkAllImagesLoaded(); };
        playerWalkImg.src = "walk.png";
        
        let imagesLoaded = { stand: false, walk: false };
        function checkAllImagesLoaded() {
            if(playerStandImg && playerStandImg.complete && playerStandImg.naturalWidth > 0) imagesLoaded.stand = true;
            if(playerWalkImg && playerWalkImg.complete && playerWalkImg.naturalWidth > 0) imagesLoaded.walk = true;
            // 只要有一张图可用就算就绪
            if((playerStandImg && imagesLoaded.stand) || (playerWalkImg && imagesLoaded.walk)) {
                playerImgReady = true;
            }
            // 如果walk没加载成功，但stand可用，也标记就绪
            if(playerStandImg && imagesLoaded.stand) playerImgReady = true;
        }
        
        // 场景背景图
        const bgImages = [null, null, null, null, null];
        for(let i=0;i<5;i++){ 
            let img = new Image(); 
            img.src = `bg_scene${i}.png`; 
            bgImages[i]=img;
        }
        
        // 音乐
        let bgMusic = null;
        function initBackgroundMusic() {
            try {
                bgMusic = new Audio('game.mp3');
                bgMusic.loop = true;
                bgMusic.volume = 0.25;
            } catch(e) { }
        }
        function startBackgroundMusic() {
            if(bgMusic && bgMusic.paused && gameRunning) bgMusic.play().catch(e => {});
        }
        
        // 全屏
        function requestFullscreen() { 
            const el = gameContainer; 
            if(el.requestFullscreen) el.requestFullscreen(); 
            else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); 
        }
        canvas.addEventListener('click', () => { 
            if(!(document.fullscreenElement || document.webkitFullscreenElement)) requestFullscreen(); 
        });
        
        function resizeCanvas() { canvas.width = LOGIC_W; canvas.height = LOGIC_H; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // 按键
        let input = { left: false, right: false, jump: false };
        const leftBtn=document.querySelector('.left-btn'), rightBtn=document.querySelector('.right-btn'), jumpBtn=document.querySelector('.jump-btn');
        function attach(btn,key){ 
            btn.addEventListener('touchstart',(e)=>{ e.preventDefault(); input[key]=true; },{passive:false}); 
            btn.addEventListener('touchend',(e)=>{ e.preventDefault(); input[key]=false; }); 
            btn.addEventListener('mousedown',()=>{ input[key]=true; }); 
            btn.addEventListener('mouseup',()=>{ input[key]=false; }); 
            btn.addEventListener('mouseleave',()=>{ input[key]=false; }); 
        }
        attach(leftBtn,'left'); attach(rightBtn,'right'); attach(jumpBtn,'jump');
        window.addEventListener('keydown',(e)=>{ 
            if(e.key==='ArrowLeft'){ input.left=true; e.preventDefault(); } 
            if(e.key==='ArrowRight'){ input.right=true; e.preventDefault(); } 
            if(e.key==='ArrowUp'||e.key===' '){ input.jump=true; e.preventDefault(); } 
        });
        window.addEventListener('keyup',(e)=>{ 
            if(e.key==='ArrowLeft') input.left=false; 
            if(e.key==='ArrowRight') input.right=false; 
            if(e.key==='ArrowUp'||e.key===' ') input.jump=false; 
        });
        
        // 玩家属性
        let player = { 
            x: 140, y: 660, w: 52, h: 68, 
            vx: 0, vy: 0, 
            speed: 5.8, 
            jumpPower: -11.2, 
            gravity: 0.62, 
            onGround: false, 
            facingRight: true
        };
        let currentScene = 0, score = 0, message = "", msgTimer = 0;
        let movingHazards = [], spikes = [];
        
        // ========== 场景数据（已降低难度）==========
        const scenes = [
            { name:"🌙 月之森", 
                platforms: [ {x:0,y:750,w:480,h:28,type:"ground"},{x:540,y:750,w:900,h:28,type:"ground"},
                    {x:100,y:695,w:90,h:22,type:"questionBlock"},{x:300,y:640,w:90,h:22,type:"questionBlock"},
                    {x:520,y:585,w:90,h:22,type:"questionBlock"},{x:750,y:530,w:90,h:22,type:"questionBlock"},
                    {x:980,y:475,w:90,h:22,type:"questionBlock"},{x:1210,y:420,w:90,h:22,type:"questionBlock"} ],
                stars: [ {x:145,y:660,size:14,col:false,color:[255,220,140]},{x:345,y:605,size:14,col:false,color:[230,200,255]},
                         {x:565,y:550,size:14,col:false,color:[255,200,180]},{x:795,y:495,size:14,col:false,color:[200,210,255]},
                         {x:1025,y:440,size:14,col:false,color:[255,230,130]},{x:1255,y:385,size:14,col:false,color:[255,190,210]} ],
                spikes: [], hazards: [] },
            { name:"⚔️ 尖刺回廊",
                platforms: [ {x:0,y:760,w:280,h:28,type:"ground"},{x:560,y:760,w:320,h:28,type:"ground"},{x:1120,y:760,w:320,h:28,type:"ground"},
                    {x:120,y:700,w:90,h:22,type:"questionBlock"},{x:360,y:645,w:90,h:22,type:"questionBlock"},
                    {x:610,y:590,w:90,h:22,type:"questionBlock"},{x:860,y:535,w:90,h:22,type:"questionBlock"},
                    {x:1110,y:480,w:90,h:22,type:"questionBlock"},{x:1360,y:425,w:90,h:22,type:"questionBlock"} ],
                stars: [ {x:165,y:665,size:14,col:false,color:[255,210,160]},{x:405,y:610,size:14,col:false,color:[255,200,200]},
                         {x:655,y:555,size:14,col:false,color:[210,190,255]},{x:905,y:500,size:14,col:false,color:[255,220,120]},
                         {x:1155,y:445,size:14,col:false,color:[240,180,240]},{x:1405,y:390,size:14,col:false,color:[255,215,150]} ],
                spikes: [ {x:150,y:725,w:55,h:24},{x:630,y:725,w:55,h:24},{x:1240,y:725,w:55,h:24} ], hazards: [] },
            { name:"🔥 火焰峡谷",
                platforms: [ {x:0,y:760,w:280,h:28,type:"ground"},{x:560,y:760,w:320,h:28,type:"ground"},{x:1120,y:760,w:320,h:28,type:"ground"},
                    {x:90,y:705,w:90,h:22,type:"questionBlock"},{x:300,y:650,w:90,h:22,type:"questionBlock"},
                    {x:520,y:595,w:90,h:22,type:"questionBlock"},{x:750,y:540,w:90,h:22,type:"questionBlock"},
                    {x:980,y:485,w:90,h:22,type:"questionBlock"},{x:1210,y:430,w:90,h:22,type:"questionBlock"} ],
                stars: [ {x:135,y:670,size:14,col:false,color:[255,220,140]},{x:345,y:615,size:14,col:false,color:[255,200,190]},
                         {x:565,y:560,size:14,col:false,color:[210,210,255]},{x:795,y:505,size:14,col:false,color:[255,220,120]},
                         {x:1025,y:450,size:14,col:false,color:[240,180,250]},{x:1255,y:395,size:14,col:false,color:[255,200,160]} ],
                spikes: [{x:540,y:725,w:60,h:24}], 
                hazards: [ {x:380,y:635,interval:100,radius:20,type:"flame_pillar",active:false,timer:0},
                           {x:840,y:555,interval:110,radius:20,type:"flame_pillar",active:false,timer:0},
                           {x:1280,y:475,interval:95,radius:20,type:"flame_pillar",active:false,timer:0} ] },
            { name:"🌿 荆棘月台",
                platforms: [ {x:0,y:760,w:260,h:28,type:"ground"},{x:500,y:760,w:300,h:28,type:"ground"},{x:1040,y:760,w:400,h:28,type:"ground"},
                    {x:80,y:705,w:90,h:22,type:"questionBlock"},{x:270,y:655,w:90,h:22,type:"questionBlock"},
                    {x:470,y:605,w:90,h:22,type:"questionBlock"},{x:680,y:555,w:90,h:22,type:"questionBlock"},
                    {x:890,y:505,w:90,h:22,type:"questionBlock"},{x:1100,y:455,w:90,h:22,type:"questionBlock"},
                    {x:1310,y:405,w:90,h:22,type:"questionBlock"} ],
                stars: [ {x:125,y:670,size:14,col:false,color:[200,220,150]},{x:315,y:620,size:14,col:false,color:[220,190,230]},
                         {x:515,y:570,size:14,col:false,color:[210,200,220]},{x:725,y:520,size:14,col:false,color:[240,210,130]},
                         {x:935,y:470,size:14,col:false,color:[210,180,250]},{x:1145,y:420,size:14,col:false,color:[190,230,160]},
                         {x:1355,y:370,size:14,col:false,color:[255,210,150]} ],
                spikes: [ {x:180,y:725,w:55,h:24},{x:620,y:725,w:55,h:24},{x:860,y:675,w:55,h:24},{x:1150,y:625,w:55,h:24} ],
                hazards: [ {x:450,y:625,range:100,radius:14,type:"thorn_vine",speed:0.65,currentX:450},
                           {x:970,y:555,range:90,radius:14,type:"thorn_vine",speed:0.7,currentX:970} ] },
            { name:"🚀 火箭码头",
                platforms: [ {x:0,y:770,w:1440,h:12,type:"water"},{x:100,y:720,w:130,h:28,type:"ground"},
                    {x:360,y:670,w:100,h:24,type:"questionBlock"},{x:610,y:720,w:160,h:28,type:"ground"},
                    {x:880,y:670,w:140,h:28,type:"ground"},{x:1160,y:620,w:130,h:26,type:"rocketPad"} ],
                stars: [ {x:150,y:685,size:14,col:false,color:[255,220,180]},{x:410,y:635,size:14,col:false,color:[220,200,255]},
                         {x:680,y:685,size:14,col:false,color:[255,230,160]},{x:950,y:635,size:14,col:false,color:[255,220,190]},
                         {x:1195,y:585,size:14,col:false,color:[255,245,200]} ],
                spikes: [], hazards: [ {x:500,y:560,range:220,width:8,type:"laser",speed:0.8,currentX:500} ],
                rocketZone: { x: 1175, y: 570, w: 100, h: 80 } }
        ];
        
        let currentPlat = [], currentStars = [];
        
        function reloadScene(sceneId){
            const sc = scenes[sceneId];
            currentPlat = sc.platforms.map(p=>({...p}));
            currentStars = sc.stars.map(s=>({...s,col:false}));
            spikes = sc.spikes ? sc.spikes.map(sp=>({...sp})) : [];
            movingHazards = [];
            if(sc.hazards){
                for(let h of sc.hazards){
                    let copy = {...h};
                    if(copy.type === 'thorn_vine') copy.currentX = copy.x;
                    if(copy.type === 'laser') copy.currentX = copy.x;
                    if(copy.type === 'flame_pillar') { copy.timer = 0; copy.active = false; }
                    movingHazards.push(copy);
                }
            }
        }
        
        function changeScene(newIdx){
            if(newIdx === currentScene) return;
            currentScene = newIdx;
            reloadScene(currentScene);
            player.x = 100;
            player.y = 660;
            player.vy = 0;
            player.vx = 0;
            player.onGround = true;
            player.facingRight = true;
            if(newIdx===4) message="🚀 触碰火箭，逃离月球！🚀";
            else message="✨ 收集星辉 躲避灾厄 ✨";
            msgTimer=90;
        }
        
        function winGame(finalScore){
            if(gameVictory) return;
            gameRunning = false;
            gameVictory = true;
            message = `✨ 胜利！星辉: ${Math.floor(finalScore)} ✨`;
            msgTimer = 200;
            if(bgMusic) bgMusic.pause();
        }
        
        function fullReset(){
            score = 0;
            currentScene = 0;
            reloadScene(0);
            player.x = 100;
            player.y = 660;
            player.vy = 0;
            player.vx = 0;
            player.onGround = true;
            player.facingRight = true;
            gameRunning = true;
            gameVictory = false;
            message = "逃离月球 · 启程！";
            msgTimer = 80;
            if(bgMusic && bgMusic.paused) startBackgroundMusic();
        }
        
        function collide(r1,r2){ 
            return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y); 
        }
        
        function updateHazards(){
            const now = Date.now();
            for(let h of movingHazards){
                if(h.type === 'thorn_vine'){
                    h.currentX = h.x + Math.sin(now * 0.0025 * h.speed) * h.range;
                }
                else if(h.type === 'laser'){
                    h.currentX = h.x + Math.sin(now * 0.002 * h.speed) * h.range;
                }
                else if(h.type === 'flame_pillar'){
                    h.timer += 1/60;
                    if(h.timer >= h.interval){
                        h.timer = 0;
                        h.active = true;
                        setTimeout(()=>{ if(h) h.active = false; }, 220);
                    }
                }
            }
        }
        
        function updateGame(){
            if(!gameRunning) return;
            
            let move = (input.left ? -1 : 0) + (input.right ? 1 : 0);
            player.vx = move * player.speed;
            player.x += player.vx;
            if(player.x < 8) player.x = 8;
            if(player.x + player.w > LOGIC_W - 8) player.x = LOGIC_W - player.w - 8;
            
            player.vy += player.gravity;
            player.y += player.vy;
            player.onGround = false;
            
            // 平台碰撞
            for(let plat of currentPlat){
                const platRect = {x:plat.x, y:plat.y, w:plat.w, h:plat.h};
                const pRect = {x:player.x, y:player.y, w:player.w, h:player.h};
                if(collide(pRect, platRect)){
                    if(player.vy >= 0 && (player.y + player.h - plat.y <= plat.h + 8)){
                        player.y = plat.y - player.h;
                        player.vy = 0;
                        player.onGround = true;
                    }
                    else if(player.vy < 0 && (plat.y + plat.h - player.y <= 12)){
                        player.y = plat.y + plat.h;
                        player.vy = 0;
                    }
                    else {
                        if(player.x + player.w/2 < plat.x + plat.w/2){
                            player.x = plat.x - player.w;
                        } else {
                            player.x = plat.x + plat.w;
                        }
                    }
                }
            }
            
            // 陷阱伤害
            for(let sp of spikes){
                if(collide({x:player.x,y:player.y,w:player.w,h:player.h}, {x:sp.x,y:sp.y,w:sp.w,h:sp.h})){
                    fullReset(); return;
                }
            }
            
            for(let h of movingHazards){
                let hx = h.currentX !== undefined ? h.currentX : h.x;
                let hy = h.y !== undefined ? h.y : (h.currentY || h.y);
                let hazardRect;
                if(h.type === 'thorn_vine'){
                    hazardRect = {x:hx - h.radius, y:hy - h.radius, w:h.radius*2, h:h.radius*2};
                } else if(h.type === 'laser'){
                    hazardRect = {x:hx, y:0, w:h.width, h:LOGIC_H};
                } else if(h.type === 'flame_pillar' && h.active){
                    hazardRect = {x:h.x - h.radius, y:h.y - h.radius*1.5, w:h.radius*2, h:h.radius*3};
                } else continue;
                if(hazardRect && collide({x:player.x,y:player.y,w:player.w,h:player.h}, hazardRect)){
                    fullReset(); return;
                }
            }
            
            const waterPlat = currentPlat.find(p=>p.type==='water');
            if(waterPlat && player.y + player.h >= waterPlat.y){ fullReset(); return; }
            if(player.y + player.h > LOGIC_H){ fullReset(); return; }
            if(player.y < -50){ fullReset(); return; }
            
            if(input.jump && player.onGround){
                player.vy = player.jumpPower;
                player.onGround = false;
                input.jump = false;
            }
            
            // 收集星星
            for(let s of currentStars){
                if(!s.col){
                    const starRect = {x:s.x - s.size/2, y:s.y - s.size/2, w:s.size, h:s.size};
                    if(collide({x:player.x,y:player.y,w:player.w,h:player.h}, starRect)){
                        s.col = true;
                        score += 100;
                        message = "⭐ +100 星辉 ⭐";
                        msgTimer = 25;
                    }
                }
            }
            
            // 场景切换
            if(currentScene === 0 && player.x + player.w > LOGIC_W - 20) { changeScene(1); player.x = 30; }
            else if(currentScene === 1 && player.x + player.w > LOGIC_W - 20) { changeScene(2); player.x = 30; }
            else if(currentScene === 2 && player.x + player.w > LOGIC_W - 20) { changeScene(3); player.x = 30; }
            else if(currentScene === 3 && player.x + player.w > LOGIC_W - 20) { changeScene(4); player.x = 80; player.y = 650; }
            
            // 火箭胜利
            if(currentScene === 4 && !gameVictory && scenes[4].rocketZone){
                if(collide({x:player.x,y:player.y,w:player.w,h:player.h}, scenes[4].rocketZone)){
                    winGame(score); return;
                }
            }
            
            // 方向
            if(player.vx > 2) player.facingRight = true;
            if(player.vx < -2) player.facingRight = false;
            
            // ========== 行走动画更新 ==========
            // 只有在地面且水平移动速度足够大时才播放行走动画
            const isWalking = player.onGround && Math.abs(player.vx) > 1.5;
            if(isWalking && playerWalkImg && playerWalkImg.complete && playerWalkImg.naturalWidth > 0) {
                frameCounter++;
                if(frameCounter >= frameDelay) {
                    frameCounter = 0;
                    currentFrame = (currentFrame + 1) % walkFrames;
                }
            } else {
                // 静止或空中时重置动画帧
                frameCounter = 0;
                currentFrame = 0;
            }
            
            updateHazards();
            if(msgTimer > 0) msgTimer--;
            else message = "";
        }
        
        // ========== 绘制角色（带动画）==========
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.w/2, player.y + player.h/2);
            if(!player.facingRight) ctx.scale(-1, 1);
            
            const isWalking = player.onGround && Math.abs(player.vx) > 1.5;
            let imgToDraw = null;
            let frameW = 0;
            let imgW = 0, imgH = 0;
            
            // 优先使用行走动画（如果在移动）
            if(isWalking && playerWalkImg && playerWalkImg.complete && playerWalkImg.naturalWidth > 0) {
                imgToDraw = playerWalkImg;
                imgW = playerWalkImg.width;
                imgH = playerWalkImg.height;
                frameW = imgW / walkFrames;
                // 从精灵表中截取当前帧
                ctx.drawImage(imgToDraw, currentFrame * frameW, 0, frameW, imgH, 
                              -player.w * 0.65, -player.h * 0.65, player.w * 1.3, player.h * 1.3);
            }
            // 否则使用站立图
            else if(playerStandImg && playerStandImg.complete && playerStandImg.naturalWidth > 0) {
                imgToDraw = playerStandImg;
                ctx.drawImage(imgToDraw, -player.w * 0.65, -player.h * 0.65, player.w * 1.3, player.h * 1.3);
            }
            // 后备：Canvas绘制
            else {
                ctx.fillStyle = "#FFD8A0";
                ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
                ctx.fillStyle = "#F0A87A";
                ctx.fillRect(-player.w/2 + 8, -player.h/2 - 6, player.w - 16, 10);
                ctx.fillStyle = "#4A2A1A";
                ctx.fillRect(-player.w/2 + 12, -player.h/2 + 12, 8, 8);
                ctx.fillRect(-player.w/2 + 32, -player.h/2 + 12, 8, 8);
            }
            
            ctx.restore();
        }
        
        function drawBackground(){
            const bgImg = bgImages[currentScene];
            if(bgImg && bgImg.complete && bgImg.naturalWidth > 0){
                ctx.drawImage(bgImg, 0, 0, LOGIC_W, LOGIC_H);
            } else {
                const gradients = [
                    ['#1a1338', '#2a1f4a', '#3a2a5a'], ['#2a1f3a', '#3a2a4a', '#4a3a6a'],
                    ['#2a1a2a', '#3a2a3a', '#5a3a4a'], ['#1a2a2a', '#2a3a3a', '#3a4a4a'],
                    ['#0f1a2a', '#1f2a3a', '#2f3a4a']
                ];
                const g = gradients[currentScene % gradients.length];
                const grad = ctx.createLinearGradient(0, 0, 0, LOGIC_H);
                grad.addColorStop(0, g[0]); grad.addColorStop(0.5, g[1]); grad.addColorStop(1, g[2]);
                ctx.fillStyle = grad; ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);
            }
            for(let i=0;i<40;i++){
                ctx.fillStyle = `rgba(255,240,200,${0.1 + Math.sin(Date.now()*0.002 + i)*0.05})`;
                ctx.fillRect((i*211) % LOGIC_W, (i*97 + Date.now()*0.15) % LOGIC_H, 2, 2);
            }
        }
        
        function drawQuestionBlock(x,y,w,h){
            ctx.fillStyle = "#FFE8A0"; ctx.fillRect(x, y, w, h);
            ctx.fillStyle = "#C97E2A"; ctx.strokeRect(x+2, y+2, w-4, h-4);
            ctx.font = `bold ${Math.floor(h*0.55)}px "Segoe UI"`;
            ctx.fillStyle = "#4A2A1A"; ctx.textAlign = "center";
            ctx.fillText("?", x + w/2, y + h/2 + 6);
            ctx.textAlign = "left";
        }
        
        function drawPlatforms(){
            for(let plat of currentPlat){
                if(plat.type === 'questionBlock') drawQuestionBlock(plat.x, plat.y, plat.w, plat.h);
                else if(plat.type === 'rocketPad'){
                    ctx.fillStyle = "#B87C54"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                    ctx.fillStyle = "#E8C084"; ctx.fillRect(plat.x + 5, plat.y - 6, plat.w - 10, 8);
                } else if(plat.type === 'water'){
                    ctx.fillStyle = "rgba(70,130,210,0.55)"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                } else {
                    ctx.fillStyle = "#D8B87C"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                    ctx.fillStyle = "#FAD896"; ctx.fillRect(plat.x + 5, plat.y - 5, plat.w - 10, 6);
                }
            }
        }
        
        function drawSpikes(){
            for(let sp of spikes){
                ctx.fillStyle = "#6A4A2A"; ctx.fillRect(sp.x, sp.y, sp.w, sp.h);
                ctx.fillStyle = "#C88C54";
                for(let i=0;i<4;i++){
                    ctx.beginPath();
                    ctx.moveTo(sp.x + i*(sp.w/4), sp.y);
                    ctx.lineTo(sp.x + i*(sp.w/4) + sp.w/8, sp.y - 14);
                    ctx.lineTo(sp.x + i*(sp.w/4) + sp.w/4, sp.y);
                    ctx.fill();
                }
            }
        }
        
        function drawStars(){
            for(let s of currentStars){
                if(!s.col){
                    ctx.fillStyle = `rgb(${s.color[0]},${s.color[1]},${s.color[2]})`;
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    for(let i=0;i<5;i++){
                        let ang = (i*72 - 36) * Math.PI/180;
                        let x1 = s.x + Math.cos(ang) * s.size/2;
                        let y1 = s.y + Math.sin(ang) * s.size/2;
                        let ang2 = (i*72) * Math.PI/180;
                        let x2 = s.x + Math.cos(ang2) * s.size/3;
                        let y2 = s.y + Math.sin(ang2) * s.size/3;
                        if(i===0) ctx.moveTo(x1, y1);
                        else ctx.lineTo(x1, y1);
                        ctx.lineTo(x2, y2);
                    }
                    ctx.fill();
                }
            }
            ctx.shadowBlur = 0;
        }
        
        function drawHazards(){
            for(let h of movingHazards){
                if(h.type === 'thorn_vine'){
                    ctx.fillStyle = "#5C8C3A";
                    ctx.beginPath();
                    ctx.ellipse(h.currentX, h.y, h.radius, h.radius*1.4, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = "#3A6A1A";
                    for(let i=0;i<6;i++){
                        ctx.beginPath();
                        ctx.moveTo(h.currentX + Math.sin(i)*6, h.y - 4);
                        ctx.lineTo(h.currentX + Math.sin(i+0.5)*10, h.y + 6);
                        ctx.lineTo(h.currentX + Math.sin(i-0.5)*10, h.y + 6);
                        ctx.fill();
                    }
                } else if(h.type === 'laser'){
                    ctx.fillStyle = "rgba(255,100,80,0.6)";
                    ctx.fillRect(h.currentX, 0, h.width, LOGIC_H);
                    ctx.fillStyle = "rgba(255,200,100,0.8)";
                    ctx.fillRect(h.currentX + 2, 0, h.width - 4, LOGIC_H);
                } else if(h.type === 'flame_pillar' && h.active){
                    ctx.fillStyle = "#FF5A2A";
                    ctx.shadowBlur = 14;
                    ctx.beginPath();
                    ctx.ellipse(h.x, h.y - h.radius/2, h.radius, h.radius*2, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = "#FFAA40";
                    ctx.beginPath();
                    ctx.ellipse(h.x, h.y - h.radius/3, h.radius-5, h.radius-5, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }
        }
        
        function drawRocket(){
            if(currentScene !== 4) return;
            const r = scenes[4].rocketZone;
            ctx.fillStyle = "#C8D0F0";
            ctx.fillRect(r.x + 18, r.y - 44, 64, 44);
            ctx.fillStyle = "#FF6A6A";
            ctx.beginPath();
            ctx.moveTo(r.x + r.w/2, r.y - 68);
            ctx.lineTo(r.x + r.w/2 + 28, r.y - 38);
            ctx.lineTo(r.x + r.w/2 - 28, r.y - 38);
            ctx.fill();
            ctx.fillStyle = "#FAD87A";
            ctx.fillRect(r.x + 24, r.y - 34, 52, 26);
            ctx.fillStyle = "#2F2F5A";
            ctx.fillRect(r.x + 42, r.y - 14, 16, 42);
            ctx.font = "bold 42px monospace";
            ctx.fillStyle = "#FFF8D0";
            ctx.fillText("🚀", r.x + r.w/2 - 20, r.y + 14);
        }
        
        function drawUI(){
            ctx.font = "bold 32px monospace";
            ctx.fillStyle = "#FFF2E0";
            ctx.fillRect(LOGIC_W - 160, 18, 148, 46);
            ctx.fillStyle = "#4A2E62";
            ctx.fillText(`${Math.floor(score)}`, LOGIC_W - 138, 56);
            if(message){
                ctx.font = "bold 18px monospace";
                ctx.fillStyle = "#FFFAD0";
                ctx.shadowBlur = 4;
                ctx.fillText(message, LOGIC_W/2 - ctx.measureText(message).width/2, LOGIC_H - 28);
                ctx.shadowBlur = 0;
            }
            let q = scenes[currentScene].name;
            ctx.font = "16px monospace";
            ctx.fillStyle = "#FFF0BF";
            ctx.fillText(q + " →", 20, LOGIC_H - 20);
            
            if(gameVictory){
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);
                ctx.font = "bold 52px monospace";
                ctx.fillStyle = "#FFE78F";
                ctx.fillText("✨ 胜利 ✨", LOGIC_W/2 - 130, LOGIC_H/2 - 50);
                ctx.font = "38px monospace";
                ctx.fillStyle = "#FFD87A";
                ctx.fillText(`星辉 ${Math.floor(score)}`, LOGIC_W/2 - 110, LOGIC_H/2 + 40);
                ctx.font = "22px monospace";
                ctx.fillText("点击「月华启程」再冒险", LOGIC_W/2 - 150, LOGIC_H - 90);
            }
        }
        
        function gameLoop(){
            updateGame();
            drawBackground();
            drawPlatforms();
            drawSpikes();
            drawStars();
            drawHazards();
            drawRocket();
            drawPlayer();
            drawUI();
            requestAnimationFrame(gameLoop);
        }
        
        startBtn.addEventListener('click', () => { 
            fullReset(); 
            startOverlay.style.display = 'none'; 
            gameRunning = true;
            gameVictory = false;
            initBackgroundMusic();
            startBackgroundMusic();
            setTimeout(() => requestFullscreen(), 200);
        });
        
        function checkRestart(){ 
            if((gameVictory || (!gameRunning && startOverlay.style.display !== 'flex')) && startOverlay.style.display !== 'flex' && !gameRunning) {
                startOverlay.style.display = 'flex';
            }
        }
        setInterval(checkRestart, 200);
        reloadScene(0);
        gameLoop();
        setInterval(()=>{ 
            if(window.matchMedia("(orientation: landscape)").matches) 
                rotateTip.classList.add('hidden'); 
            else 
                rotateTip.classList.remove('hidden'); 
        }, 300);
    })();
</script>
</body>
</html>
